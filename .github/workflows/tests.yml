name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unittest
        run: python -B -m run_local_checks
      - name: Preserve offline test and evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebius-offline-evidence
          path: evaluation/results/*.json
